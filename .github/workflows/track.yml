name: Netto Pokémon Tracker

on:
  schedule:
    # Alle 10 Minuten. GitHub startet geplante Jobs "best effort",
    # d.h. es kann sich mal ein paar Minuten verzögern – für Netto völlig ok.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # Knopf zum manuellen Starten (zum Testen)

# Damit der Job state.json zurück ins Repo schreiben darf:
permissions:
  contents: write

# Verhindert, dass sich zwei Läufe überschneiden:
concurrency:
  group: netto-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Verfügbarkeit prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}   # optional – leer = https://ntfy.sh
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}  # optional
        run: python3 check_netto.py

      - name: Zustand speichern
        if: success()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "netto-tracker-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Zustand aktualisiert [skip ci]"
            git push
          else
            echo "Kein Zustandswechsel – nichts zu committen."
          fi
